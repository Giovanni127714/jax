# Default hyperparameters, mirroring src/utils/config.py::Config.

# Model
hidden_dim: 128
output_dim: 10
num_layers: 3
dropout: 0.1

# Training
batch_size: 32
learning_rate: 0.001
num_steps: 1000
seed: 42

# Data
input_dim: 20
num_samples: 1000

# Optimization
gradient_clip: 1.0
weight_decay: 0.01

# Logging
log_every: 100
use_wandb: false
