# W&B sweep configuration for hyperparameter tuning on the
# regression example. Launch with:
#   wandb sweep configs/regression.yaml
#   wandb agent <sweep_id>

name: regression-sweep
method: bayes
metric:
  name: val_loss
  goal: minimize
parameters:
  learning_rate:
    min: 0.0001
    max: 0.01
  hidden_dim:
    values: [32, 64, 128]
  num_layers:
    values: [1, 2, 3]
  dropout:
    min: 0.0
    max: 0.3
command:
  - ${env}
  - python
  - examples/01_regression.py
