<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JAX MLP Trainer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#9670;</text></svg>" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">◆</span>
      <div>
        <div class="brand-name">JAX MLP Assistent</div>
        <div class="brand-sub">Chat-bediening voor je eigen trainer &mdash; geen taalmodel, een commando-assistent</div>
      </div>
    </div>
    <div class="status-pill" id="status-pill" data-status="idle">
      <span class="status-dot"></span>
      <span id="status-text">Inactief</span>
    </div>
  </header>

  <main class="chat-wrap">
    <div class="chat-log" id="chat-log"></div>

    <div class="composer-area">
      <div class="chips" id="chips"></div>
      <form id="composer-form" class="composer">
        <textarea
          id="composer-input"
          rows="1"
          placeholder="Typ een bericht, bv. 'train een classificatiemodel' of 'voorspel 1 2 0 0'…"
        ></textarea>
        <button type="submit" id="send-btn" class="send-btn" aria-label="Verstuur">➤</button>
      </form>
    </div>
  </main>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
